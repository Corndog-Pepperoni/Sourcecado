name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway database for the test run. The Supabase CLI serves the same
    # major version for local development (supabase/config.toml).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Behavioural evaluations
        working-directory: backend
        run: python -m coworker.evals --suite sourcing --artifacts .eval-artifacts

  container:
    name: Backend container image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # The hosted demo runs this image on Railway (docs/engineering/hosted-demo.md).
      - name: Build the image
        run: docker build -t sourcecado-backend backend

  gui:
    name: Desktop GUI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build
